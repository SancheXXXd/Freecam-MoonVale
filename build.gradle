plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
loom { accessWidenerPath = file('src/main/resources/freecam.accesswidener') }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation fileTree(dir: 'src/main/resources/META-INF/jars', include: ['*.jar'])
    compileOnly files('libs/modmenu-21.0.0.jar')
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        filter { line -> line.replace('"1.1.6+26.3"', '"' + project.version + '"') }
    }
}
jar {
    from('LICENSE')
    archiveFileName = "FreecamMV-fabric-${project.mod_version.toString().split('\\+')[0]}-mc${project.minecraft_version}.jar"
}
sourcesJar {
    archiveFileName = "FreecamMV-fabric-${project.mod_version.toString().split('\\+')[0]}-mc${project.minecraft_version}-sources.jar"
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
sourceSets {
    collisionTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('collisionRegression', JavaExec) {
    dependsOn collisionTestClasses
    classpath = sourceSets.collisionTest.runtimeClasspath
    mainClass = 'net.xolt.freecam.util.SweptPointTest'
}
check.dependsOn collisionRegression
